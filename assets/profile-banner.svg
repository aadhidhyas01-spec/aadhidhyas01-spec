  <text x="78" y="222" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="1">AADHIDHYA</text>
  <rect x="82" y="246" width="520" height="4" rx="2" fill="url(#accent)"/>
  <text x="84" y="286" fill="#BAE6FD" font-family="JetBrains Mono,Consolas,monospace" font-size="20" letter-spacing="2">AI  /  MACHINE LEARNING  /  ROBOTICS</text>
  <text x="84" y="326" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="3">LEARN • BUILD • EXPERIMENT • INNOVATE</text>
