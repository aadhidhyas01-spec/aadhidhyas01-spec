<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Aadhidhya — AI, Machine Learning and Robotics</title>
  <desc id="desc">A dark futuristic banner with cyan and violet gradients, circuit lines and developer portfolio typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B17"/>
      <stop offset=".52" stop-color="#101D3A"/>
      <stop offset="1" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93C5FD" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="965" cy="112" rx="330" ry="250" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" stroke-opacity=".65" stroke-width="2">
    <path d="M0 70H120L150 100H260"/>
    <path d="M0 290H160L190 260H330"/>
    <path d="M1200 68H1080L1050 98H970"/>
    <path d="M1200 294H1080L1048 262H940"/>
    <circle cx="260" cy="100" r="5" fill="#22D3EE"/>
    <circle cx="330" cy="260" r="5" fill="#60A5FA"/>
    <circle cx="970" cy="98" r="5" fill="#A78BFA"/>
    <circle cx="940" cy="262" r="5" fill="#22D3EE"/>
    <circle cx="1010" cy="180" r="96" stroke-opacity=".22"/>
    <circle cx="1010" cy="180" r="70" stroke-opacity=".24" stroke-dasharray="5 9"/>
  </g>
  <g transform="translate(900 180)" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".9">
    <path d="M-38 33L0-42L38 33Z"/>
    <path d="M-20 33L0-7L20 33Z" opacity=".55"/>
    <circle cx="0" cy="-42" r="6" fill="#22D3EE" stroke="none"/>
    <circle cx="-38" cy="33" r="6" fill="#60A5FA" stroke="none"/>
    <circle cx="38" cy="33" r="6" fill="#A78BFA" stroke="none"/>
  </g>
